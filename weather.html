<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Day Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .location-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .location-card:hover {
            transform: translateY(-5px);
        }

        .location-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .current-weather {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .current-temp {
            font-size: 2.5em;
            font-weight: bold;
        }

        .current-condition {
            font-size: 1.2em;
            margin-top: 5px;
        }

        .temp-range {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        .forecast-days {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .forecast-day {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .day-header {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .day-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .detail-label {
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3-Day Weather Forecast</h1>
        <button class="refresh-btn" onclick="loadAllWeather()">Refresh Weather</button>
        <div id="loading" class="loading">Loading weather data...</div>
        <div id="weather-container" class="locations-grid"></div>
        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        // Locations to fetch weather for
        const locations = [
            { name: 'Farnham, Surrey, UK', query: 'Farnham,UK' },
            { name: 'London, England', query: 'London,UK' },
            { name: 'Nantgarw, Wales', query: 'Nantgarw,UK' },
            { name: 'Norwich, Norfolk', query: 'Norwich,UK' },
            { name: 'New York, USA', query: 'New York,US' }
        ];

        // Function to fetch weather data
        async function fetchWeather(location) {
            try {
                const response = await fetch(`weather_api.php?location=${encodeURIComponent(location.query)}`);
                if (!response.ok) {
                    throw new Error('Weather data not available');
                }
                const data = await response.json();
                return { ...data, locationName: location.name };
            } catch (error) {
                console.error(`Error fetching weather for ${location.name}:`, error);
                return { error: true, locationName: location.name, message: error.message };
            }
        }

        // Function to create weather card HTML
        function createWeatherCard(data) {
            if (data.error) {
                return `
                    <div class="location-card">
                        <div class="location-name">${data.locationName}</div>
                        <div class="error">Unable to load weather data: ${data.message}</div>
                    </div>
                `;
            }

            const current = data.current;
            const forecast = data.forecast.forecastday;

            let forecastHTML = '';
            forecast.forEach((day, index) => {
                const date = new Date(day.date);
                const dayName = index === 0 ? 'Today' : date.toLocaleDateString('en-US', { weekday: 'long' });

                forecastHTML += `
                    <div class="forecast-day">
                        <div class="day-header">${dayName} - ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
                        <div class="day-details">
                            <div class="detail-item">
                                <span class="detail-label">High:</span>
                                <span>${day.day.maxtemp_c}°C</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Low:</span>
                                <span>${day.day.mintemp_c}°C</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Rain Chance:</span>
                                <span>${day.day.daily_chance_of_rain}%</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Precipitation:</span>
                                <span>${day.day.totalprecip_mm} mm</span>
                            </div>
                            <div class="detail-item" style="grid-column: 1 / -1;">
                                <span class="detail-label">Condition:</span>
                                <span>${day.day.condition.text}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="location-card">
                    <div class="location-name">${data.locationName}</div>
                    <div class="current-weather">
                        <div class="current-temp">${current.temp_c}°C</div>
                        <div class="current-condition">${current.condition.text}</div>
                        <div class="temp-range">
                            <div>
                                <div style="font-size: 0.9em; opacity: 0.8;">Feels Like</div>
                                <div style="font-size: 1.3em;">${current.feelslike_c}°C</div>
                            </div>
                            <div>
                                <div style="font-size: 0.9em; opacity: 0.8;">Humidity</div>
                                <div style="font-size: 1.3em;">${current.humidity}%</div>
                            </div>
                        </div>
                    </div>
                    <div class="forecast-days">
                        ${forecastHTML}
                    </div>
                </div>
            `;
        }

        // Function to load all weather data
        async function loadAllWeather() {
            const container = document.getElementById('weather-container');
            const loading = document.getElementById('loading');
            const lastUpdated = document.getElementById('last-updated');

            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const weatherPromises = locations.map(location => fetchWeather(location));
                const weatherData = await Promise.all(weatherPromises);

                loading.style.display = 'none';

                weatherData.forEach(data => {
                    container.innerHTML += createWeatherCard(data);
                });

                const now = new Date();
                lastUpdated.textContent = `Last updated: ${now.toLocaleString()}`;
            } catch (error) {
                loading.style.display = 'none';
                container.innerHTML = '<div class="error">Failed to load weather data. Please try again.</div>';
            }
        }

        // Load weather when page loads
        window.addEventListener('load', loadAllWeather);
    </script>
</body>
</html>
